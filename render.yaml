services:
  - type: web
    name: frameforge-chatgpt
    runtime: docker
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8787
      - key: MCP_PUBLIC_ORIGIN
        value: https://chatgpt.frameforger.com
      - key: FRAMEFORGE_WEB_URL
        value: https://frameforger.com
      - key: AUTH_MODE
        value: oauth
      - key: FRAMEFORGE_BACKEND_AUTH_MODE
        value: forward
      - key: FRAMEFORGE_API_BASE
        value: https://api.frameforger.com
      - key: OAUTH_ISSUER
        value: https://auth.frameforger.com
      - key: OAUTH_JWKS_URL
        value: https://auth.frameforger.com/.well-known/jwks.json
      - key: OAUTH_AUDIENCE
        value: https://chatgpt.frameforger.com

  - type: web
    name: frameforge-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node api-proxy.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: BASE44_MCP_GATEWAY_URL
        value: https://sociable-prime-motion-lab.base44.app/functions/mcpGateway
